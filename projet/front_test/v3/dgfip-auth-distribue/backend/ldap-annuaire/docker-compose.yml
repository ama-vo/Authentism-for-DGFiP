services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: dgfip-ldap
    environment:
      LDAP_ORGANISATION: "DGFiP"
      LDAP_DOMAIN: "dgfip.fr"
      LDAP_BASE_DN: "dc=dgfip,dc=fr"
      LDAP_ADMIN_PASSWORD: "AdminLdap#2026"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: dgfip-ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
    ports:
      - "8080:80"
    depends_on:
      - openldap

volumes:
  ldap_data:
  ldap_config:
