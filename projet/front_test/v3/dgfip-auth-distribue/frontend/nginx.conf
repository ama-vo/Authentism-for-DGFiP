server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- En-têtes de sécurité ---------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP : uniquement le même hôte, pas de script/style externe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # --- Aucun accès aux sources ------------------------------------
    # Le conteneur ne contient que le bundle compilé (dist/) : il n'y a
    # ni .ts/.tsx, ni source maps, ni node_modules à servir. Ces
    # règles bloquent par prudence tout fichier de config qui aurait
    # pu être copié par erreur.
    location ~* \.(ts|tsx|map|env|md|lock)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- Assets statiques (immuables, hashés par Vite) ----------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- API : relais interne vers l'Application Web -------------------
    # Le navigateur n'appelle jamais webapp directement : seul Nginx,
    # sur le réseau Docker interne, connaît son adresse.
    location /api/ {
        proxy_pass http://webapp:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # --- Application React (SPA) ---------------------------------------
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
