# Nginx : terminaison TLS, répartition de charge vers webapp, file
# d'attente et limitation de débit (cahier des charges §3.1), en-têtes de
# sécurité, et service du bundle React compilé.

server_tokens off;

# --- File d'attente / limitation de débit ------------------------------
# Les requêtes au-delà du débit sont MISES EN FILE (burst, sans nodelay)
# puis servies au rythme autorisé ; au-delà de la file -> 429. On lisse
# ainsi les pics (8h-10h, échéance fiscale) au lieu de saturer le backend.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
limit_req_status 429;
limit_conn_status 429;

# --- Répartition de charge ---------------------------------------------
# Le nom Docker "webapp" résout vers toutes les répliques
# (`docker compose up --scale webapp=3`) : Nginx répartit entre elles
# (moindre nombre de connexions) et écarte une réplique défaillante.
upstream webapp_pool {
    least_conn;
    server webapp:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- HTTP : redirection permanente vers HTTPS --------------------------
server {
    listen 8080;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /pki/edge/tls.crt;
    ssl_certificate_key /pki/edge/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    limit_conn conn_zone 30;

    # --- En-têtes de sécurité -----------------------------------------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP stricte : uniquement le même hôte ; aucun script en ligne ni externe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    # --- Aucun accès à des fichiers sources ou cachés ------------------
    location ~* \.(ts|tsx|map|env|md|lock|json)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # --- API : relais HTTPS vers l'Application Web ---------------------
    # Endpoints d'authentification : débit très limité (anti brute-force).
    location ~ ^/api/(login\.php|password/|admin\.php/token) {
        limit_req zone=auth_zone burst=20;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/conf.d/proxy_webapp.inc;
    }

    location /api/ {
        limit_req zone=api_zone burst=60;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/conf.d/proxy_webapp.inc;
    }

    # --- Assets statiques (immuables, hashés par Vite) -----------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Application React (SPA) ---------------------------------------
    location / {
        try_files $uri /index.html;
    }
}
