# Authentism - deploiement Kubernetes (HTTP)
#
# Deployer :
#   kubectl apply -f authentism.yaml -n n-grp4 --insecure-skip-tls-verify
#
# Acceder au site : http://localhost:8080
#   kubectl port-forward svc/web 8080:80 -n n-grp4 --insecure-skip-tls-verify
#
# Voir les mails : http://localhost:8025
#   kubectl port-forward svc/mail 8025:8025 -n n-grp4 --insecure-skip-tls-verify
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentism-files
data:
  init.sql: |
    -- Logs d'audit
    CREATE TABLE audit_logs (
      id          BIGSERIAL PRIMARY KEY,
      timestamp   TIMESTAMPTZ NOT NULL DEFAULT now(),
      account     TEXT        NOT NULL,
      action      TEXT        NOT NULL,
      endpoint    TEXT        NOT NULL,
      ip          TEXT        NOT NULL,
      priority    TEXT        NOT NULL CHECK (priority IN ('INFO', 'ELEVE', 'CRITIQUE')),
      success     BOOLEAN     NOT NULL,
      details     TEXT
    );
    CREATE INDEX idx_audit_timestamp ON audit_logs (timestamp DESC);
    CREATE INDEX idx_audit_priority  ON audit_logs (priority);

    -- Pages du dashboard
    CREATE TABLE pages (
      slug        TEXT PRIMARY KEY,
      title       TEXT    NOT NULL,
      description TEXT    NOT NULL,
      content     TEXT    NOT NULL,
      visible     BOOLEAN NOT NULL DEFAULT true,
      position    INT     NOT NULL DEFAULT 0
    );

    INSERT INTO pages (slug, title, description, content, position) VALUES
      ('declaration', 'Déclarer mes revenus',
       'Accéder à la déclaration en ligne.',
       'La campagne de déclaration des revenus est ouverte. Pensez à vérifier vos informations avant la date limite de fin juin.', 1),
      ('documents', 'Mes documents',
       'Consulter vos avis d''imposition et justificatifs.',
       'Retrouvez ici vos avis d''impôt sur le revenu, de taxe foncière et vos accusés de réception.', 2),
      ('paiements', 'Mes paiements',
       'Gérer vos prélèvements et paiements en ligne.',
       'Consultez vos échéanciers, modifiez vos coordonnées bancaires et réglez vos impôts en ligne.', 3),
      ('messagerie', 'Messagerie sécurisée',
       'Échanger avec votre centre des finances publiques.',
       'Vous n''avez aucun nouveau message. Vos échanges avec l''administration apparaîtront ici.', 4);

    -- Changement de mot de passe (tous les 90 jours)
    CREATE TABLE password_changes (
      fiscal_number TEXT PRIMARY KEY,
      changed_at    TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  ldap-test.ldif: |
    # Comptes de test
    #   admin  : 1000000000001 / Admin#Dgfip2026!
    #   agent  : 2000000000002 / Agent#Dgfip2026!
    #   usager : 3000000000003 / Usager#Dgfip2026!
    #
    # Panneau d'administration :
    #   1000000000001 / AdminPanel#2026!

    dn: ou=users,dc=dgfip,dc=local
    objectClass: organizationalUnit
    ou: users

    dn: ou=admins,dc=dgfip,dc=local
    objectClass: organizationalUnit
    ou: admins

    dn: uid=1000000000001,ou=users,dc=dgfip,dc=local
    objectClass: inetOrgPerson
    uid: 1000000000001
    cn: Alice Martin
    givenName: Alice
    sn: Martin
    mail: admin@dgfip.local
    employeeType: admin
    userPassword: {SSHA}mcs08L/TzXN5STLHsVK9+kBz4Rhn+yxjKT4bhg==

    dn: uid=2000000000002,ou=users,dc=dgfip,dc=local
    objectClass: inetOrgPerson
    uid: 2000000000002
    cn: Bruno Durand
    givenName: Bruno
    sn: Durand
    mail: agent@dgfip.local
    employeeType: agent
    userPassword: {SSHA}FbzHpnu6p3fzKBIGIlNBy5BU1t07ueijlzZcOQ==

    dn: uid=3000000000003,ou=users,dc=dgfip,dc=local
    objectClass: inetOrgPerson
    uid: 3000000000003
    cn: Camille Petit
    givenName: Camille
    sn: Petit
    mail: usager@dgfip.local
    employeeType: usager
    userPassword: {SSHA}GvNQzfge6F2/FRowlXjCEoeOETgsOtyF9ohHqA==

    dn: uid=1000000000001,ou=admins,dc=dgfip,dc=local
    objectClass: inetOrgPerson
    uid: 1000000000001
    cn: Administration - Alice Martin
    sn: Martin
    description: Compte d'administration Authentism
    userPassword: {SSHA}qhMSh51vOZbTzhpZnAxn+2lIzxBPq+I44MtVtw==
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / {
            try_files $uri /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      enableServiceLinks: false
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        args: ["redis-server", "--requirepass", "redis-pass"]
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
  - { name: p6379, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - { name: POSTGRES_DB, value: authentism }
        - { name: POSTGRES_USER, value: authentism }
        - { name: POSTGRES_PASSWORD, value: postgres-pass }
        volumeMounts:
        - { name: files, mountPath: /docker-entrypoint-initdb.d/init.sql, subPath: init.sql }
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
      volumes:
      - { name: files, configMap: { name: authentism-files } }

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
  - { name: p5432, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
spec:
  replicas: 1
  selector:
    matchLabels: { app: mail }
  template:
    metadata:
      labels: { app: mail }
    spec:
      enableServiceLinks: false
      containers:
      - name: mail
        image: axllent/mailpit:latest
        ports:
        - containerPort: 1025
        - containerPort: 8025
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mail
spec:
  selector: { app: mail }
  ports:
  - { name: p1025, port: 1025, targetPort: 1025 }
  - { name: p8025, port: 8025, targetPort: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: ldap-test }
  template:
    metadata:
      labels: { app: ldap-test }
    spec:
      enableServiceLinks: false
      containers:
      - name: ldap-test
        image: osixia/openldap:1.5.0
        ports:
        - containerPort: 389
        args: ["--copy-service"]
        env:
        - { name: LDAP_ORGANISATION, value: "DGFiP (test)" }
        - { name: LDAP_DOMAIN, value: dgfip.local }
        - { name: LDAP_ADMIN_PASSWORD, value: ldap-pass }
        - { name: LDAP_TLS, value: "false" }
        volumeMounts:
        - { name: files, mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom/50-comptes-test.ldif, subPath: ldap-test.ldif }
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
      volumes:
      - { name: files, configMap: { name: authentism-files } }

---
apiVersion: v1
kind: Service
metadata:
  name: ldap-test
spec:
  selector: { app: ldap-test }
  ports:
  - { name: p389, port: 389, targetPort: 389 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      enableServiceLinks: false
      containers:
      - name: backend
        image: amavo/authentism-backend:v1
        ports:
        - containerPort: 3000
        env:
        - { name: LDAP_URL, value: "ldap://ldap-test:389" }
        - { name: LDAP_BIND_DN, value: "cn=admin,dc=dgfip,dc=local" }
        - { name: LDAP_BIND_PASSWORD, value: ldap-pass }
        - { name: LDAP_USERS_DN, value: "ou=users,dc=dgfip,dc=local" }
        - { name: LDAP_ADMINS_DN, value: "ou=admins,dc=dgfip,dc=local" }
        - { name: REDIS_URL, value: "redis://:redis-pass@redis:6379" }
        - { name: DATABASE_URL, value: "postgres://authentism:postgres-pass@postgres:5432/authentism" }
        - { name: SMTP_HOST, value: mail }
        - { name: SMTP_PORT, value: "1025" }
        - { name: PUBLIC_URL, value: "http://localhost:8080" }
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
  - { name: p3000, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      containers:
      - name: web
        image: amavo/authentism-frontend:v1
        ports:
        - containerPort: 80
        volumeMounts:
        - { name: files, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "300m", memory: "256Mi" }
      volumes:
      - { name: files, configMap: { name: authentism-files } }

---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
  - { name: p80, port: 80, targetPort: 80 }