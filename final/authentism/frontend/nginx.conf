# =============================================================
#  Passerelle nginx : HTTPS + file d'attente + répartition de charge
# =============================================================

# --- File d'attente / limitation du trafic ---
# Zone globale (tous les clients) : au-delà de 1000 connexions/s sur l'authentification,
# les requêtes sont MISES EN ATTENTE (jusqu'à 5000) au lieu de surcharger l'API.
limit_req_zone $server_name        zone=auth_global:10m rate=1000r/s;
# Zone par adresse IP : limite la force brute venant d'une même machine
limit_req_zone $binary_remote_addr zone=auth_ip:10m     rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_ip:10m      rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# --- Répartiteur de charge ---
# "backend" est résolu par le DNS de Docker : une adresse par réplica,
# nginx répartit les requêtes entre elles à tour de rôle (round robin).
upstream api {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP -> redirection permanente vers HTTPS
server {
    listen 80;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    # Certificat X.509 signé par la PKI Authentism
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # En-têtes de sécurité (XSS, clickjacking, sniffing, HTTPS forcé)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 16k;
    limit_conn conn_ip 50;

    # Message JSON lisible quand la file d'attente est pleine
    error_page 429 503 = @busy;
    location @busy {
        default_type application/json;
        return 429 '{"error":"Le service est tres sollicite. Merci de patienter quelques instants."}';
    }

    # --- Authentification : file d'attente globale + limite par IP ---
    location /api/auth/ {
        limit_req zone=auth_global burst=5000;      # sans "nodelay" = vraie file d'attente
        limit_req zone=auth_ip burst=10 nodelay;
        include /etc/nginx/proxy_api.conf;
    }

    # --- Reste de l'API ---
    location /api/ {
        limit_req zone=api_ip burst=60 nodelay;
        include /etc/nginx/proxy_api.conf;
    }

    # --- Frontend React (application monopage) ---
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 7d;
    }
}
